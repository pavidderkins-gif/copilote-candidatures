<title>Copilote Candidatures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : poste de pilotage — barre d'onglets collante, une colonne de travail, cartes d'offres en grille souple */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --surface-2: #eceee9; --ink: #18201d; --muted: #5b6660;
  --line: #d9ddd7; --accent: #2f4bd8; --accent-ink: #ffffff; --accent-soft: #e4e8fb;
  --fort: #1e7a4f; --bon: #2a7a8c; --moyen: #a86f12; --faible: #858d88;
  --lvmh: #80612f; --lvmh-soft: #f3ece0; --danger: #b3261e;
  --st-prep: #5d6a8c; --st-sent: #2f4bd8; --st-talk: #7d45c9; --st-offer: #1e7a4f; --st-closed: #858d88;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #1a201d; --surface-2: #222a26; --ink: #e6ebe8; --muted: #9ba7a1;
  --line: #2e3833; --accent: #8fa3ff; --accent-ink: #0d1330; --accent-soft: #232a4a;
  --fort: #4cc38a; --bon: #5db8cb; --moyen: #e2aa4c; --faible: #7f8984;
  --lvmh: #d6b47e; --lvmh-soft: #2d2618; --danger: #f2877e; color-scheme: dark;
  --st-prep: #a3aed0; --st-sent: #8fa3ff; --st-talk: #c4a3ff; --st-offer: #4cc38a; --st-closed: #7f8984; } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1a201d; --surface-2: #222a26; --ink: #e6ebe8; --muted: #9ba7a1;
  --line: #2e3833; --accent: #8fa3ff; --accent-ink: #0d1330; --accent-soft: #232a4a;
  --fort: #4cc38a; --bon: #5db8cb; --moyen: #e2aa4c; --faible: #7f8984;
  --lvmh: #d6b47e; --lvmh-soft: #2d2618; --danger: #f2877e; color-scheme: dark;
  --st-prep: #a3aed0; --st-sent: #8fa3ff; --st-talk: #c4a3ff; --st-offer: #4cc38a; --st-closed: #7f8984; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* En-tête */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 4px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; letter-spacing: -0.01em; margin: 0; }
.brand small { font-family: var(--f-body); font-weight: 500; font-size: 0.8rem; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.status-line { font-size: 0.8rem; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 6px 0; scrollbar-width: none; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 8px 12px 10px; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-family: var(--f-mono); font-size: 0.75rem; background: var(--surface-2); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }

main { padding-block: 20px 64px; display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
main > * { min-width: 0; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head p { margin: 0; color: var(--muted); font-size: 0.85rem; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

/* Bandeau de synthèse */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.summary div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.summary b { font-family: var(--f-mono); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.summary span { font-size: 0.8rem; color: var(--muted); }
.summary .alert b { color: var(--moyen); }

.notice { background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; font-size: 0.9rem; display: grid; gap: 6px; }
.notice ul { margin: 0; padding-left: 18px; }
.notice.warn { background: var(--surface-2); }

/* Cartes d'offres */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.offer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.offer.lvmh { background: var(--lvmh-soft); border-color: color-mix(in srgb, var(--lvmh) 35%, var(--line)); }
.offer-head { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; }
.offer-title { margin: 0; font-size: 1.02rem; font-weight: 600; line-height: 1.3; }
.offer-title button { all: unset; cursor: pointer; }
.offer-title button:hover { text-decoration: underline; }
.offer-title button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.offer-sub { color: var(--muted); font-size: 0.88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 0.74rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.lvmh { background: transparent; border: 1px solid var(--lvmh); color: var(--lvmh); font-weight: 600; }
.chip.etape { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.warn { color: var(--moyen); }
.chip.ok { color: var(--fort); font-weight: 600; }
.chip.ko { color: var(--danger); font-weight: 600; }
.points { display: grid; gap: 8px; font-size: 0.88rem; }
.points ul { margin: 2px 0 0; padding-left: 18px; }
.points .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; color: var(--muted); }
.provisoire { font-size: 0.78rem; color: var(--muted); font-style: italic; }
.bref { display: grid; gap: 4px; font-size: 0.9rem; }
.bref p { margin: 0; }
.bref .a-savoir { color: var(--danger); }

/* Jauge de note */
.gauge { width: 56px; height: 56px; position: relative; }
.gauge svg { width: 56px; height: 56px; transform: rotate(-90deg); }
.gauge .track { stroke: var(--surface-2); }
.gauge .val { font-family: var(--f-mono); font-weight: 600; font-size: 0.95rem; position: absolute; inset: 0; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.s-fort { color: var(--fort); stroke: var(--fort); } .s-bon { color: var(--bon); stroke: var(--bon); }
.s-moyen { color: var(--moyen); stroke: var(--moyen); } .s-faible { color: var(--faible); stroke: var(--faible); }

/* Actions */
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn:disabled { opacity: 0.5; cursor: default; }
.link-out { font-size: 0.85rem; font-weight: 500; margin-left: auto; }
.ecart-form { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
.ecart-form input { flex: 1 1 180px; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

/* Liste compacte (à surveiller) */
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .score { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.row .t { font-weight: 500; }
.row .m { color: var(--muted); font-size: 0.83rem; }
.row button.t { all: unset; cursor: pointer; font-weight: 500; }
.row button.t:hover { text-decoration: underline; }
.row button.t:focus-visible { outline: 2px solid var(--accent); }

/* Pipeline */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi b { display: block; font-family: var(--f-mono); font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 0.8rem; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 110px 1fr 36px; gap: 10px; align-items: center; font-size: 0.85rem; }
.bar .track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
.bar .n { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }

/* Historique */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar input, .toolbar select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.toolbar input[type="search"] { flex: 1 1 220px; min-width: 0; }
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; min-width: 760px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; background: var(--surface); position: sticky; top: 0; }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.excl td { color: var(--muted); }
td button.t { all: unset; cursor: pointer; font-weight: 500; color: var(--ink); }
td button.t:hover { text-decoration: underline; }

/* Réglages */
.settings { display: grid; gap: 18px; max-width: 720px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.panel p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 0.85rem; }
.tag button { all: unset; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.tag button:hover { background: var(--line); }
.add { display: flex; gap: 6px; flex-wrap: wrap; }
.add input { flex: 1 1 200px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.fields label { display: grid; gap: 4px; font-size: 0.85rem; font-weight: 500; }
.fields input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-family: var(--f-mono); }
.fields small { color: var(--muted); font-weight: 400; }

/* Panneau de détail */
.drawer-bg { position: fixed; inset: 0; background: rgba(10, 14, 12, 0.45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 21; overflow-y: auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px;
  display: grid; gap: 16px; align-content: start; border-left: 1px solid var(--line); }
.drawer h2 { font-size: 1.25rem; }
.drawer textarea { width: 100%; min-height: 90px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); resize: vertical; }
.drawer select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 0.88rem; margin: 0; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.dossier { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.dossier pre { white-space: pre-wrap; font-family: var(--f-body); font-size: 0.86rem; background: var(--surface-2); border-radius: 8px; padding: 10px; margin: 0; max-height: 320px; overflow-y: auto; }
.close { justify-self: end; }
.kit { border: 1px solid var(--accent); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; background: var(--surface); }
.kit h3 { margin: 0; font-family: var(--f-display); font-size: 1.05rem; font-weight: 600; }
.kit ol { margin: 0; padding-left: 22px; display: grid; gap: 14px; }
.kit li::marker { font-family: var(--f-mono); font-weight: 600; color: var(--accent); }
.kit .step-t { font-weight: 600; }
.kit .step-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.kit details { margin-top: 6px; }
.kit summary { cursor: pointer; color: var(--accent); font-size: 0.85rem; }
.answers { display: grid; gap: 4px; margin-top: 8px; }
.answer { display: grid; grid-template-columns: minmax(110px, 34%) minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 0.85rem; padding: 4px 0; border-top: 1px solid var(--line); }
.answer:first-child { border-top: 0; }
.answer .k { color: var(--muted); }
.answer .v { overflow-wrap: anywhere; }
.answer .v.missing { color: var(--moyen); font-style: italic; }
.btn.small { padding: 3px 9px; font-size: 0.78rem; }
.done { color: var(--fort); font-weight: 600; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
table.mini { min-width: 0; }
.timeline { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; font-size: 0.85rem; }
.timeline li { display: grid; grid-template-columns: 92px 1fr; gap: 8px; }
.timeline .d { font-family: var(--f-mono); color: var(--muted); }
.banner-err { background: color-mix(in srgb, var(--danger) 14%, var(--surface)); color: var(--ink); border-radius: var(--r); padding: 10px 14px; }

/* Suivi : ruban des phases, agenda à droite, candidatures en lignes avec leur avancement */
.muted { color: var(--muted); margin: 0; font-size: 0.85rem; }
.st-prep { --c: var(--st-prep); } .st-sent { --c: var(--st-sent); } .st-talk { --c: var(--st-talk); }
.st-offer { --c: var(--st-offer); } .st-closed { --c: var(--st-closed); }
.sv-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.sv-head h2 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
.sv-head p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
.phases { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.phase { all: unset; box-sizing: border-box; cursor: pointer; padding: 12px 14px 14px; display: grid; gap: 1px; position: relative; border-left: 1px solid var(--line); min-width: 0; }
.phase:first-child { border-left: 0; }
.phase:hover { background: color-mix(in srgb, var(--c) 6%, var(--surface)); }
.phase:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.phase b { font-family: var(--f-mono); font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--c); }
.phase span { font-size: 0.8rem; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phase::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--c); opacity: 0.3; }
.phase[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 11%, var(--surface)); }
.phase[aria-pressed="true"]::after { opacity: 1; }
@media (max-width: 620px) {
  .phases { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .phase:nth-child(4) { border-left: 0; }
  .phase:nth-child(n+4) { border-top: 1px solid var(--line); }
  .phase b { font-size: 1.4rem; }
}
.sv-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 330px); gap: 22px; align-items: start; }
@media (max-width: 920px) { .sv-layout { grid-template-columns: minmax(0, 1fr); } .sv-side { order: -1; } }
.sv-main { display: grid; gap: 14px; min-width: 0; }
.sv-side { display: grid; gap: 14px; min-width: 0; }
.sv-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sv-tools input[type="search"] { flex: 1 1 220px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { all: unset; cursor: pointer; padding: 6px 12px; font-size: 0.85rem; font-weight: 500; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sv-liste { display: grid; gap: 18px; }
.cand-group { display: grid; gap: 8px; }
.cand-group > h3 { margin: 0; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--c); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.cand-group > h3 span { font-family: var(--f-mono); color: var(--muted); letter-spacing: 0; }
.cand { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(160px, 230px); gap: 10px 14px; align-items: center; }
.cand-group.st-offer .cand { border-color: color-mix(in srgb, var(--st-offer) 45%, var(--line)); }
.mono { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 0.95rem; background: color-mix(in srgb, var(--c) 15%, var(--surface)); color: var(--c); }
.cand-main { min-width: 0; }
.cand-t { all: unset; cursor: pointer; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.cand-t:hover { text-decoration: underline; }
.cand-t:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cand-s { font-size: 0.83rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 0; align-items: center; margin-top: 2px; }
.cand-s > span + span::before { content: "·"; margin: 0 6px; }
.cand-s .ent { color: var(--ink); font-weight: 500; }
.cand-s .chip::before { content: none; }
.cand-s .chip { margin-left: 8px; }
.steps { display: flex; gap: 4px; margin-top: 9px; max-width: 220px; }
.steps i { flex: 1 1 0; height: 4px; border-radius: 2px; background: var(--surface-2); }
.steps i.on { background: var(--c); }
.steps i.ko { background: var(--danger); }
.steps i.off { background: var(--st-closed); }
.ask { margin-top: 7px; font-size: 0.8rem; color: var(--moyen); font-weight: 500; }
.cand-side { display: grid; gap: 4px; justify-items: end; text-align: right; min-width: 0; }
.pill { font-size: 0.74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--c) 15%, var(--surface)); color: var(--c); white-space: nowrap; }
.since { font-size: 0.76rem; color: var(--muted); }
.cand-next { font-size: 0.82rem; line-height: 1.35; }
.due { font-family: var(--f-mono); font-size: 0.74rem; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.due.late { background: color-mix(in srgb, var(--danger) 14%, var(--surface)); color: var(--danger); }
.due.today { background: color-mix(in srgb, var(--moyen) 18%, var(--surface)); color: var(--moyen); }
@media (max-width: 620px) {
  .cand { grid-template-columns: 40px minmax(0, 1fr); }
  .mono { width: 40px; height: 40px; }
  .cand-side { grid-column: 1 / -1; justify-items: start; text-align: left; grid-auto-flow: row; padding-top: 8px; border-top: 1px solid var(--line); }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h3 { margin: 0; font-family: var(--f-display); font-size: 1.02rem; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h3 small { font-family: var(--f-body); font-weight: 500; color: var(--muted); font-size: 0.78rem; text-align: right; }
.ag-group { display: grid; gap: 2px; }
.ag-group + .ag-group { padding-top: 6px; border-top: 1px solid var(--line); }
.ag-group > .eyebrow { margin: 2px 0 2px; }
.ag-item { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px; margin: 0 -6px; border-radius: 8px; }
.ag-item:hover { background: var(--surface-2); }
.ag-item:focus-visible { outline: 2px solid var(--accent); }
.ag-date { font-family: var(--f-mono); font-size: 0.74rem; font-weight: 600; text-align: center; padding: 3px 0; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.ag-date.late { background: color-mix(in srgb, var(--danger) 14%, var(--surface)); color: var(--danger); }
.ag-date.today { background: color-mix(in srgb, var(--moyen) 18%, var(--surface)); color: var(--moyen); }
.ag-date.q { background: color-mix(in srgb, var(--moyen) 18%, var(--surface)); color: var(--moyen); font-size: 0.85rem; }
.ag-t { display: block; font-size: 0.87rem; font-weight: 500; line-height: 1.35; }
.ag-s { display: block; font-size: 0.77rem; color: var(--muted); overflow-wrap: anywhere; }
.reco-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.reco-st { all: unset; cursor: pointer; font-size: 0.74rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 15%, var(--surface)); color: var(--c); white-space: nowrap; }
.reco-st:focus-visible { outline: 2px solid var(--accent); }
.sv-chiffres { display: grid; gap: 12px; }
.chart { width: 100%; height: auto; display: block; }
.chart .g { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .v { fill: var(--ink); font-size: 11px; font-family: var(--f-mono); font-weight: 600; }
.chart .b { fill: color-mix(in srgb, var(--st-sent) 55%, var(--surface)); }
.chart .b.now { fill: var(--st-sent); }
/* Panneau : formulaires du suivi et de l'ajout */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px 12px; }
.form-grid label { display: grid; gap: 4px; font-size: 0.82rem; font-weight: 500; color: var(--muted); min-width: 0; }
.form-grid .wide { grid-column: 1 / -1; }
.form-grid input, .form-grid select, .form-grid textarea, .journal input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; width: 100%; }
.form-grid textarea { min-height: 80px; resize: vertical; }
.form-grid .check { display: flex; gap: 8px; align-items: center; color: var(--ink); }
.form-grid .check input { width: auto; }
.dr-suivi { display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
.ask-box { background: color-mix(in srgb, var(--moyen) 14%, var(--surface)); }
.journal { display: grid; gap: 8px; }
.journal .add input[type="date"] { flex: 0 0 150px; }
.timeline li.e span:last-child { color: var(--muted); }
.dr-head { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; }
.dr-head .mono { width: 56px; height: 56px; font-size: 1.1rem; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; color: var(--muted); text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 0.88rem; z-index: 30; }
@media (max-width: 520px) {
  .offer-head { grid-template-columns: 48px 1fr; gap: 10px; }
  .gauge, .gauge svg { width: 48px; height: 48px; }
  .row { grid-template-columns: 40px minmax(0, 1fr); }
  .row .row-act { grid-column: 2; }
  .bar { grid-template-columns: 90px 1fr 30px; }
}
@media (prefers-reduced-motion: no-preference) { .btn, nav.tabs a { transition: border-color .15s, background-color .15s, color .15s; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1 class="brand">Copilote <small>Candidatures de David</small></h1>
      <div class="status-line" id="status">Chargement des offres…</div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Vues">
      <a href="#aujourdhui" data-view="aujourdhui">Aujourd'hui<span class="count" id="c-auj"></span></a>
      <a href="#suivi" data-view="suivi">Suivi<span class="count" id="c-pipe"></span></a>
      <a href="#historique" data-view="historique">Historique<span class="count" id="c-hist"></span></a>
      <a href="#reglages" data-view="reglages">Réglages</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="drawer-root"></div>
<div id="toast-root"></div>

<script>
(() => {
  "use strict";

  // ---------- Référentiels ----------
  const ETAPES = [
    { id: "nouvelle", label: "Nouvelle" },
    { id: "interessante", label: "Intéressante" },
    { id: "dossier_demande", label: "Dossier demandé" },
    { id: "dossier_pret", label: "Dossier prêt" },
    { id: "postulee", label: "Postulée" },
    { id: "relance", label: "Relancée" },
    { id: "entretien", label: "Entretien" },
    { id: "offre", label: "Offre reçue" },
    { id: "refus", label: "Refus" },
    { id: "sans_suite", label: "Sans suite" },
    { id: "ecartee", label: "Écartée" },
  ];
  const ETAPE_LABEL = Object.fromEntries(ETAPES.map(e => [e.id, e.label]));
  const APRES_ENVOI = new Set(["postulee", "relance", "entretien", "offre", "refus", "sans_suite"]);
  const AXES = { data_bi: "Data / BI", finance: "Finance", supply_chain: "Supply Chain", startup: "Startup" };
  const CANAUX = { ats: "Site de l'entreprise", email: "Email", linkedin: "LinkedIn (manuel)", indeed: "Indeed (manuel)", vie_business_france: "VIE Business France", interne_lvmh: "Interne LVMH", reseau: "Réseau / recommandation", cabinet: "Cabinet de recrutement", spontanee: "Candidature spontanée", autre: "Autre" };
  const RECO = { postuler: "Postuler", postuler_en_compensant: "Postuler en compensant", passer: "Passer" };
  const STATUT_TRI = { propose: "Sélection", a_surveiller: "À surveiller", archive: "Archivée", exclu: "Exclue" };
  const DEFAULT_REGLAGES = { seuil: 6, passe_droit: 8, plafond_jour: 5, cibles: [] };

  // ---------- État ----------
  const S = {
    db: null, dl: null,
    offres: new Map(), suivi: new Map(), dossiers: new Map(), rapports: [], reglages: null, candidat: null, copy: {},
    loaded: { offres: false, suivi: false, rapports: false },
    stale: false, writable: true,
    view: "aujourdhui", ouvert: null, ecartEnCours: null,
    hist: { q: "", statut: "tous", tri: "note" },
    pipeAxe: "tous",
    sv: { filtre: "actives", q: "" }, ajout: false, recos: null,
  };

  const $ = (s, el = document) => el.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
  const fmtNote = n => (typeof n === "number" ? n.toFixed(1).replace(".0", "").replace(".", ",") : "—");
  const fmtDate = d => { if (!d) return ""; const [y, m, j] = String(d).slice(0, 10).split("-"); return j && m && y ? `${j}/${m}/${y}` : esc(d); };
  const classe = n => typeof n !== "number" ? "s-faible" : n >= 8 ? "s-fort" : n >= 7 ? "s-bon" : n >= 6 ? "s-moyen" : "s-faible";
  const etapeDe = h => S.suivi.get(h)?.etape || "nouvelle";
  const reglages = () => ({ ...DEFAULT_REGLAGES, ...(S.reglages || {}) });

  function toast(msg) {
    const root = $("#toast-root");
    root.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toast.t); toast.t = setTimeout(() => { root.innerHTML = ""; }, 2600);
  }

  async function copier(key) {
    const text = S.copy[key]; if (!text) return;
    try { await navigator.clipboard.writeText(text); toast("Copié"); }
    catch {
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} ta.remove();
      toast(ok ? "Copié" : "Copie impossible ici : ouvre l'aperçu et sélectionne le texte");
    }
  }
  async function telechargerPdf(url, nom) {
    try {
      if (!S.dl) throw new Error("no-dl");
      const r = await fetch(url); if (!r.ok) throw new Error("fetch");
      await S.dl.save({ filename: nom, data: await r.blob() }); toast("PDF enregistré");
    } catch (e) {
      if (e && e.code === "declined") return;
      toast("Téléchargement direct impossible ici : utilise « Ouvrir le PDF »");
    }
  }
  const relanceLe = s => { const d = prochaineRelance(s); return d ? d.toISOString().slice(0, 10) : ""; };

  // ---------- Données dérivées ----------
  const offresList = () => [...S.offres.values()];
  const dernierRapport = () => S.rapports[0] || null;
  const parNote = (a, b) => (b.note ?? -1) - (a.note ?? -1) || String(a.entreprise).localeCompare(String(b.entreprise));
  function joursDepuis(iso) { if (!iso) return 0; return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
  // Relance à J+7 après l'envoi, puis une seconde 7 jours après la première (J+14)
  function prochaineRelance(s) {
    if (!s || !["postulee", "relance"].includes(s.etape)) return null;
    if ((s.nb_relances || 0) >= 2) return null;
    const base = s.etape === "relance" ? (s.relance_le || s.envoye_le || s.maj) : (s.envoye_le || s.maj);
    if (!base) return null;
    const d = new Date(base); d.setDate(d.getDate() + 7); return d;
  }
  function aRelancer() {
    return offresList().filter(o => { const d = prochaineRelance(S.suivi.get(o.id)); return d && d.getTime() <= Date.now(); });
  }

  // ---------- Écritures ----------
  async function ecrireSuivi(h, patch, msg) {
    if (!S.db) return;
    const prev = S.suivi.get(h) || {};
    const next = { ...prev, ...patch, maj: new Date().toISOString() };
    if (patch.etape && APRES_ENVOI.has(patch.etape) && !prev.envoye_le) next.envoye_le = next.maj;
    if (patch.etape === "relance") { next.relance_le = next.maj; next.nb_relances = (prev.nb_relances || 0) + 1; }
    if (patch.etape && patch.etape !== prev.etape) next.historique = [...(Array.isArray(prev.historique) ? prev.historique : []), { etape: patch.etape, date: next.maj }].slice(-30);
    S.suivi.set(h, next); render();
    try { await S.db.doc("suivi/" + h).set(next); if (msg) toast(msg); }
    catch (e) {
      if (prev && Object.keys(prev).length) S.suivi.set(h, prev); else S.suivi.delete(h);
      render();
      toast(e && e.code === "invalid_argument" ? "Modification refusée : tu n'as pas les droits d'écriture ici." : "Enregistrement impossible pour l'instant. Réessaie dans un moment.");
    }
  }
  async function ecrireRecos(items) {
    if (!S.db) return;
    const prev = S.recos; S.recos = { ...(S.recos || {}), items }; render();
    try { await S.db.doc("reglages/recommandations").set({ items, maj: new Date().toISOString() }); toast("Recommandations à jour"); }
    catch { S.recos = prev; render(); toast("Enregistrement impossible pour l'instant."); }
  }
  async function ecrireReglages(next) {
    if (!S.db) return;
    try { await S.db.doc("reglages/general").set({ ...next, maj: new Date().toISOString() }); toast("Réglages enregistrés"); }
    catch { toast("Enregistrement impossible pour l'instant."); }
  }

  // ---------- Composants ----------
  function gauge(n) {
    const c = 2 * Math.PI * 24, v = typeof n === "number" ? Math.max(0, Math.min(10, n)) / 10 : 0;
    return `<div class="gauge ${classe(n)}" aria-label="Note ${fmtNote(n)} sur 10">
      <svg viewBox="0 0 56 56" aria-hidden="true"><circle class="track" cx="28" cy="28" r="24" fill="none" stroke-width="5"/>
      <circle cx="28" cy="28" r="24" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}"/></svg>
      <span class="val">${fmtNote(n)}</span></div>`;
  }
  function chipsDe(o) {
    const out = [];
    if (o.groupe_lvmh) out.push(`<span class="chip lvmh">Interne LVMH</span>`);
    if (o.contrat) out.push(`<span class="chip">${esc(o.contrat)}</span>`);
    if (o.axe && AXES[o.axe]) out.push(`<span class="chip">${AXES[o.axe]}</span>`);
    if (o.langue) out.push(`<span class="chip">${o.langue === "en" ? "Anglais" : o.langue === "fr" ? "Français" : esc(o.langue)}</span>`);
    if (o.canal && CANAUX[o.canal] && !o.groupe_lvmh) out.push(`<span class="chip">${CANAUX[o.canal]}</span>`);
    if (o.date_publication) out.push(`<span class="chip">Publiée le ${fmtDate(o.date_publication)}</span>`);
    const lv = { ok: ["ok", "Lien vérifié"], protege: ["warn", "Site protégé : ouvre pour vérifier"], non_verifiable: ["warn", "Lien non vérifié"], retire: ["ko", "Offre retirée"] }[o.lien_verifie];
    if (lv) out.push(`<span class="chip ${lv[0]}">${lv[1]}${o.lien_verifie_le && o.lien_verifie !== "retire" ? " le " + fmtDate(o.lien_verifie_le) : ""}</span>`);
    const e = etapeDe(o.id); if (e !== "nouvelle") out.push(`<span class="chip etape">${ETAPE_LABEL[e]}</span>`);
    return `<div class="chips">${out.join("")}</div>`;
  }
  function actionsDe(o) {
    const e = etapeDe(o.id), h = esc(o.id), url = safeUrl(o.url);
    if (S.ecartEnCours === o.id) {
      return `<form class="ecart-form" data-ecart="${h}"><input id="motif-${h}" name="motif" placeholder="Pourquoi l'écarter ? (aide à affiner la note)" autocomplete="off">
        <button class="btn primary" type="submit">Écarter</button><button class="btn ghost" type="button" data-act="annuler-ecart">Annuler</button></form>`;
    }
    const b = (act, label, on) => `<button class="btn${on ? " on" : ""}" type="button" data-act="${act}" data-h="${h}" ${S.writable ? "" : "disabled"}>${label}</button>`;
    const parts = [];
    if (!o.groupe_lvmh && S.dossiers.has(o.id) && !APRES_ENVOI.has(e)) parts.push(`<button class="btn primary" type="button" data-open="${h}">Postuler : kit prêt</button>`);
    parts.push(b("interessante", "Intéressé", e === "interessante"));
    if (!o.groupe_lvmh) parts.push(b("dossier_demande", e === "dossier_pret" ? "Dossier prêt" : "Préparer le dossier", e === "dossier_demande" || e === "dossier_pret"));
    parts.push(b("postulee", o.groupe_lvmh ? "Postulé en interne" : "J'ai postulé", APRES_ENVOI.has(e)));
    parts.push(e === "ecartee" ? b("rouvrir", "Rouvrir", false) : `<button class="btn ghost" type="button" data-act="ecarter" data-h="${h}" ${S.writable ? "" : "disabled"}>Écarter</button>`);
    if (url) parts.push(`<a class="link-out" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Voir l'offre ↗</a>`);
    return `<div class="actions">${parts.join("")}</div>`;
  }
  function carte(o) {
    const pf = (o.points_forts || []).map(x => `<li>${esc(x)}</li>`).join("");
    const ec = (o.ecarts || []).map(x => `<li>${esc(x)}</li>`).join("");
    return `<article class="offer${o.groupe_lvmh ? " lvmh" : ""}">
      <div class="offer-head">${gauge(o.note)}
        <div style="min-width:0"><h3 class="offer-title"><button type="button" data-open="${esc(o.id)}">${esc(o.intitule)}</button></h3>
        <div class="offer-sub">${esc(o.entreprise)} · ${esc(o.lieu || o.pays || "")}${o.recommandation && RECO[o.recommandation] ? ` · <strong>${RECO[o.recommandation]}</strong>` : ""}</div>
        ${chipsDe(o)}</div></div>
      ${o.en_bref || o.a_savoir ? `<div class="bref">${o.en_bref ? `<p><b>Le poste :</b> ${esc(o.en_bref)}</p>` : ""}${o.pour_toi ? `<p><b>Pour toi :</b> ${esc(o.pour_toi)}</p>` : ""}${o.a_savoir ? `<p class="a-savoir"><b>À savoir :</b> ${esc(o.a_savoir)}</p>` : ""}</div>` : ""}
      ${pf || ec ? `<div class="points">${pf ? `<div><div class="label">Pourquoi</div><ul>${pf}</ul></div>` : ""}${ec ? `<div><div class="label">Écarts</div><ul>${ec}</ul></div>` : ""}</div>` : ""}
      ${o.motif ? `<div class="provisoire">${esc(o.motif)}</div>` : ""}
      ${actionsDe(o)}
    </article>`;
  }
  function ligne(o, extra = "") {
    return `<div class="row"><span class="score ${classe(o.note)}">${fmtNote(o.note)}</span>
      <div style="min-width:0"><button type="button" class="t" data-open="${esc(o.id)}">${esc(o.intitule)}</button>
      <div class="m">${esc(o.entreprise)} · ${esc(o.lieu || "")}${o.ecarts && o.ecarts[0] ? " · " + esc(o.ecarts[0]) : ""}${extra}</div></div>
      <div class="row-act">${etapeDe(o.id) !== "nouvelle" ? `<span class="chip etape">${ETAPE_LABEL[etapeDe(o.id)]}</span>` : ""}</div></div>`;
  }

  // ---------- Vues ----------
  function vueAujourdhui() {
    const r = dernierRapport();
    const jour = r ? r.date : offresList().map(o => o.rapport).sort().pop();
    const duJour = offresList().filter(o => o.rapport === jour && etapeDe(o.id) !== "ecartee");
    const selection = duJour.filter(o => o.statut === "propose" && !o.groupe_lvmh).sort(parNote);
    const lvmh = duJour.filter(o => o.groupe_lvmh && o.statut !== "exclu").sort(parNote);
    const surveiller = duJour.filter(o => o.statut === "a_surveiller" && !o.groupe_lvmh).sort(parNote);
    const demandes = offresList().filter(o => etapeDe(o.id) === "dossier_demande");
    const prets = offresList().filter(o => etapeDe(o.id) === "dossier_pret");
    const relances = aRelancer();

    if (!S.offres.size) {
      return S.loaded.offres
        ? `<div class="empty">Aucune offre pour l'instant. La recherche du matin (chaque jour à 6 h 58) les ajoutera ici.</div>`
        : `<div class="empty">${S.stale ? "Les offres ne répondent pas encore. Vérifie ta connexion, la page se mettra à jour toute seule." : "Chargement des offres…"}</div>`;
    }
    let html = `<section><div class="section-head"><div><div class="eyebrow">${jour ? "Rapport du " + fmtDate(jour) : "Dernier rapport"}</div>
      <h2>Qu'est-ce que je fais aujourd'hui ?</h2></div>
      ${r && r.lien ? `<p><a href="${esc(safeUrl(r.lien))}" target="_blank" rel="noopener noreferrer">Rapport complet sur GitHub ↗</a></p>` : ""}</div>
      <div class="summary">
        <div><b>${selection.length}</b><span>offres à regarder</span></div>
        <div><b>${lvmh.length}</b><span>offres LVMH (interne)</span></div>
        <div><b>${surveiller.length}</b><span>à surveiller</span></div>
        <div class="${prets.length ? "alert" : ""}"><b>${prets.length}</b><span>dossiers prêts à relire</span></div>
        <div><b>${demandes.length}</b><span>dossiers demandés</span></div>
        <div class="${relances.length ? "alert" : ""}"><b>${relances.length}</b><span>relances à faire</span></div>
      </div></section>`;

    const notes = [];
    if (r && Array.isArray(r.questions) && r.questions.length) notes.push(`<div class="notice"><strong>Questions pour toi</strong><ul>${r.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul></div>`);
    if (r && r.avertissement) notes.push(`<div class="notice warn">${esc(r.avertissement)}</div>`);
    if (relances.length) notes.push(`<div class="notice"><strong>À relancer (postulé il y a 7 jours ou plus)</strong><ul>${relances.map(o => `<li>${esc(o.intitule)} — ${esc(o.entreprise)}</li>`).join("")}</ul></div>`);
    if (notes.length) html += `<section style="display:grid;gap:10px">${notes.join("")}</section>`;

    if (prets.length) html += `<section><div class="section-head"><h2>Dossiers prêts : à toi de postuler</h2><p>Clique sur « Postuler » : CV en PDF, portfolio, lettre et réponses du formulaire prêtes à copier.</p></div><div class="grid">${prets.sort(parNote).map(carte).join("")}</div></section>`;
    html += `<section><div class="section-head"><h2>À regarder</h2><p>Sélection du jour : jusqu'à ${reglages().plafond_jour} offres, plus toutes celles à ${fmtNote(reglages().passe_droit)}/10 ou plus.</p></div>
      ${selection.length ? `<div class="grid">${selection.map(carte).join("")}</div>` : `<div class="empty">Rien au-dessus du seuil aujourd'hui.</div>`}</section>`;
    if (lvmh.length) html += `<section><div class="section-head"><h2>Groupe LVMH — à postuler en interne</h2><p>Analysées pour toi. L'outil ne prépare et n'envoie rien pour ces offres.</p></div><div class="grid">${lvmh.map(carte).join("")}</div></section>`;
    if (surveiller.length) html += `<section><div class="section-head"><h2>À surveiller</h2><p>Au-dessus du seuil mais hors sélection, ou à vérifier.</p></div><div class="rows">${surveiller.map(o => ligne(o)).join("")}</div></section>`;
    return html;
  }

  // ---------- Suivi : phases, agenda, candidatures ----------
  const PHASES = [
    { id: "prep", label: "À préparer", etapes: ["interessante", "dossier_demande", "dossier_pret"] },
    { id: "sent", label: "Envoyées", etapes: ["postulee", "relance"] },
    { id: "talk", label: "En discussion", etapes: ["entretien"] },
    { id: "offer", label: "Offres", etapes: ["offre"] },
    { id: "closed", label: "Closes", etapes: ["refus", "sans_suite"] },
  ];
  const PHASE_DE = Object.fromEntries(PHASES.flatMap(p => p.etapes.map(e => [e, p.id])));
  const ORDRE_GROUPES = ["offer", "talk", "sent", "prep", "closed"];
  const AVANCEMENT = { interessante: 0, dossier_demande: 0, dossier_pret: 0, postulee: 1, relance: 2, entretien: 3, offre: 4, refus: 4, sans_suite: 4 };
  const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const RECO_ST = { demandee: ["Demandée", "st-prep"], accord: ["Accord donné", "st-sent"], recue: ["Reçue", "st-offer"] };
  const RECO_SUIVANT = { demandee: "accord", accord: "recue", recue: "demandee" };

  const isoJour = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
  const aujourdhui = () => isoJour(new Date());
  // « 5 nov. », ou « oct. 2026 » pour une date connue au mois près
  const jourCourt = d => {
    const s = String(d || ""); if (!s) return "";
    if (/^\d{4}-\d{2}$/.test(s)) return `${MOIS[+s.slice(5, 7) - 1]} ${s.slice(0, 4)}`;
    const x = new Date(s.length === 10 ? s + "T12:00:00" : s); return isNaN(x) ? esc(s) : `${x.getDate()} ${MOIS[x.getMonth()]}`;
  };
  const nomEntreprise = n => String(n || "").replace(/^client de\s+/i, "").replace(/\s*\(.*?\)\s*/g, " ").trim();
  function initiales(nom) {
    const mots = nomEntreprise(nom).split(/[\s\-–&'’/]+/).filter(m => m && !/^(sa|sas|ag|cie|group|groupe|de|du|des|la|le|les|et|banque|bank)$/i.test(m));
    const a = mots[0] || "?", b = mots[1];
    return (a[0] + (b ? b[0] : (a[1] || ""))).toUpperCase();
  }
  const candidatures = () => offresList().filter(o => PHASE_DE[etapeDe(o.id)]);
  const phaseDe = o => PHASE_DE[etapeDe(o.id)];
  function derniereActivite(s) {
    const ds = [...(s.historique || []).map(h => h.date), ...(s.journal || []).map(j => j.date), s.envoye_le].filter(Boolean).map(d => String(d).slice(0, 10));
    return ds.length ? ds.sort().pop() : "";
  }
  const ACTION_DEFAUT = { interessante: "Préparer la candidature", dossier_demande: "Dossier en préparation par Copilote", dossier_pret: "Envoyer la candidature : le dossier est prêt",
    postulee: "Attendre la réponse", relance: "Attendre la réponse", entretien: "Noter où en est l'échange", offre: "Répondre à l'offre" };
  function prochaineEtape(s) {
    if (s.prochaine_action || s.prochaine_date) return { t: s.prochaine_action || ACTION_DEFAUT[s.etape] || "", d: s.prochaine_date || "" };
    if (s.etape === "postulee" || s.etape === "relance") {
      const r = prochaineRelance(s);
      return r ? { t: s.etape === "relance" ? "Seconde relance" : "Relancer", d: isoJour(r) } : { t: "Attendre la réponse", d: "" };
    }
    return { t: ACTION_DEFAUT[s.etape] || "", d: "" };
  }
  function urgence(d) {
    if (!d || d.length < 10) return "";
    const n = Math.round((new Date(d + "T12:00:00") - new Date(aujourdhui() + "T12:00:00")) / 86400000);
    return n < 0 ? "late" : n === 0 ? "today" : n <= 7 ? "week" : "later";
  }

  function agendaItems() {
    const items = [];
    for (const o of candidatures()) {
      const s = S.suivi.get(o.id) || {};
      if (phaseDe(o) === "closed" || s.etape === "dossier_demande") continue;
      const nx = prochaineEtape(s);
      if (nx.d || ["dossier_pret", "offre"].includes(s.etape) || s.prochaine_action) items.push({ o, t: nx.t, d: nx.d, u: urgence(nx.d) });
    }
    return items.sort((a, b) => (a.d || "9999").localeCompare(b.d || "9999"));
  }
  const questions = () => candidatures().filter(o => (S.suivi.get(o.id) || {}).a_confirmer);

  function vueSuivi() {
    const cands = candidatures();
    if (!cands.length) {
      return `<section class="sv-head"><div><div class="eyebrow">Suivi</div><h2>Tes candidatures</h2><p>Aucune candidature suivie pour l'instant.</p></div>
        <button class="btn primary" type="button" data-act="ajout-demarche">Ajouter une démarche</button></section>
        <div class="empty">Ajoute une démarche faite hors de Copilote, ou clique « Intéressé » sur une offre du jour : elle apparaîtra ici avec ses prochaines étapes.</div>`;
    }
    const par = Object.fromEntries(PHASES.map(p => [p.id, cands.filter(o => phaseDe(o) === p.id)]));
    const actives = cands.length - par.closed.length;
    const ag = agendaItems(), qs = questions();
    const urgent = ag.filter(a => a.u === "late" || a.u === "today").length;
    const resume = [`${actives} en cours`, par.offer.length ? `${par.offer.length} offre${par.offer.length > 1 ? "s" : ""} à traiter` : "", urgent ? `${urgent} action${urgent > 1 ? "s" : ""} en retard ou pour aujourd'hui` : "", qs.length ? `${qs.length} point${qs.length > 1 ? "s" : ""} à confirmer` : ""].filter(Boolean).join(" · ");
    const phases = PHASES.map(p => `<button type="button" class="phase st-${p.id}" data-phase="${p.id}" aria-pressed="${S.sv.filtre === p.id}">
        <b>${par[p.id].length}</b><span>${p.label}</span></button>`).join("");
    return `<section class="sv-head"><div><div class="eyebrow">Suivi au ${fmtDate(aujourdhui())}</div><h2>Tes candidatures</h2><p>${resume}</p></div>
        <button class="btn primary" type="button" data-act="ajout-demarche">Ajouter une démarche</button></section>
      <nav class="phases" aria-label="Filtrer par phase">${phases}</nav>
      <section class="sv-layout">
        <div class="sv-main">
          <div class="sv-tools">
            <div class="seg" role="group" aria-label="Afficher">${[["actives", "En cours"], ["toutes", "Toutes"]].map(([v, l]) => `<button type="button" data-filtre="${v}" aria-pressed="${S.sv.filtre === v}">${l}</button>`).join("")}</div>
            <input type="search" id="sv-q" placeholder="Chercher une entreprise, un poste, un contact" value="${esc(S.sv.q)}" aria-label="Chercher une candidature">
          </div>
          <div id="sv-liste" class="sv-liste"></div>
        </div>
        <aside class="sv-side">${carteAgenda(ag)}${carteQuestions(qs)}${carteRecos()}</aside>
      </section>
      ${blocChiffres(cands)}`;
  }

  function renderSuiviListe() {
    const box = $("#sv-liste"); if (!box) return;
    const q = S.sv.q.trim().toLowerCase(), f = S.sv.filtre;
    const liste = candidatures().filter(o => {
      const ph = phaseDe(o), s = S.suivi.get(o.id) || {};
      if (f === "actives" && ph === "closed") return false;
      if (PHASES.some(p => p.id === f) && ph !== f) return false;
      if (q && ![o.entreprise, o.intitule, o.lieu, s.contact, s.note].join(" ").toLowerCase().includes(q)) return false;
      return true;
    });
    if (!liste.length) { box.innerHTML = `<div class="empty">${q ? "Aucune candidature ne correspond à ta recherche." : "Rien dans cette phase pour l'instant."}</div>`; return; }
    box.innerHTML = ORDRE_GROUPES.map(ph => {
      const g = liste.filter(o => phaseDe(o) === ph).sort((a, b) => (prochaineEtape(S.suivi.get(a.id) || {}).d || "9999").localeCompare(prochaineEtape(S.suivi.get(b.id) || {}).d || "9999"));
      if (!g.length) return "";
      const p = PHASES.find(x => x.id === ph);
      return `<section class="cand-group st-${ph}"><h3>${p.label}<span>${g.length}</span></h3>${g.map(ligneCandidature).join("")}</section>`;
    }).join("");
  }

  function actionRapide(o, s) {
    const h = esc(o.id), dis = S.writable ? "" : "disabled";
    if (s.etape === "dossier_pret" && !o.groupe_lvmh) return `<button class="btn primary small" type="button" data-open="${h}">Postuler</button>`;
    if (s.etape === "interessante" && o.origine === "manuel") return `<button class="btn small" type="button" data-act="postulee" data-h="${h}" ${dis}>J'ai postulé</button>`;
    if (s.etape === "interessante" && !o.groupe_lvmh) return `<button class="btn small" type="button" data-act="dossier_demande" data-h="${h}" ${dis}>Préparer le dossier</button>`;
    const r = prochaineRelance(s);
    if (r && r.getTime() <= Date.now()) return `<button class="btn primary small" type="button" data-act="relance" data-h="${h}" ${dis}>J'ai relancé</button>`;
    return "";
  }

  function ligneCandidature(o) {
    const s = S.suivi.get(o.id) || {}, e = s.etape, nx = prochaineEtape(s), u = urgence(nx.d);
    const der = derniereActivite(s), j = phaseDe(o) !== "prep" && der && der.length === 10 ? joursDepuis(der + "T12:00:00") : null;
    const source = o.origine === "manuel" ? "ajoutée par toi" : typeof o.note === "number" ? `Copilote ${fmtNote(o.note)}/10` : "Copilote";
    const idx = AVANCEMENT[e];
    const pas = ["Préparée", "Envoyée", "Relancée", "Entretien", "Décision"].map((l, i) => `<i class="${i <= idx ? (i === 4 && e === "refus" ? "ko" : i === 4 && e === "sans_suite" ? "off" : "on") : ""}" title="${l}"></i>`).join("");
    return `<article class="cand">
      <div class="mono" aria-hidden="true">${esc(initiales(o.entreprise))}</div>
      <div class="cand-main"><button type="button" class="cand-t" data-open="${esc(o.id)}">${esc(o.intitule)}</button>
        <div class="cand-s"><span class="ent">${esc(nomEntreprise(o.entreprise))}</span>${o.lieu ? `<span>${esc(o.lieu)}</span>` : ""}<span>${source}</span>${o.groupe_lvmh ? `<span class="chip lvmh">Interne LVMH</span>` : ""}</div>
        <div class="steps" role="img" aria-label="Avancement : ${esc(ETAPE_LABEL[e])}">${pas}</div>
        ${s.a_confirmer ? `<div class="ask">À confirmer : ${esc(s.a_confirmer)}</div>` : ""}</div>
      <div class="cand-side"><span class="pill">${esc(ETAPE_LABEL[e])}</span>
        ${j !== null ? `<span class="since">${j <= 0 ? "dernier échange aujourd'hui" : `dernier échange il y a ${j} j`}</span>` : ""}
        ${nx.t ? `<span class="cand-next">${esc(nx.t)}${nx.d ? ` <span class="due ${u}">${jourCourt(nx.d)}</span>` : ""}</span>` : ""}
        ${actionRapide(o, s)}</div>
    </article>`;
  }

  function carteAgenda(ag) {
    const groupes = [["late", "En retard"], ["today", "Aujourd'hui"], ["week", "Dans les 7 jours"], ["later", "Plus tard"], ["", "Sans date"]];
    const corps = groupes.map(([u, l]) => {
      const g = ag.filter(a => a.u === u); if (!g.length) return "";
      return `<div class="ag-group"><div class="eyebrow">${l}</div>${g.map(a => `<button type="button" class="ag-item" data-open="${esc(a.o.id)}">
        <span class="ag-date ${a.u}">${a.d ? jourCourt(a.d) : "—"}</span>
        <span style="min-width:0"><span class="ag-t">${esc(a.t)}</span><span class="ag-s">${esc(nomEntreprise(a.o.entreprise))} · ${esc(a.o.intitule)}</span></span></button>`).join("")}</div>`;
    }).join("");
    return `<section class="card"><h3>À faire <small>${ag.length ? ag.length + " action" + (ag.length > 1 ? "s" : "") : ""}</small></h3>${corps || `<p class="muted">Rien de prévu. Ajoute une prochaine étape dans une candidature pour la voir ici.</p>`}</section>`;
  }
  function carteQuestions(qs) {
    if (!qs.length) return "";
    return `<section class="card"><h3>À confirmer <small>${qs.length}</small></h3>
      <p class="muted">Des dates sont passées sans nouvelles. Ouvre la candidature pour noter ce qui s'est passé.</p>
      ${qs.map(o => `<button type="button" class="ag-item" data-open="${esc(o.id)}"><span class="ag-date q">?</span>
        <span style="min-width:0"><span class="ag-t">${esc((S.suivi.get(o.id) || {}).a_confirmer)}</span><span class="ag-s">${esc(nomEntreprise(o.entreprise))} · ${esc(o.intitule)}</span></span></button>`).join("")}</section>`;
  }
  function carteRecos() {
    const items = (S.recos && Array.isArray(S.recos.items)) ? S.recos.items : [];
    return `<section class="card"><h3>Lettres de recommandation <small>${items.filter(r => r.statut === "recue").length}/${items.length} reçues</small></h3>
      ${items.length ? items.map((r, i) => { const [lab, cls] = RECO_ST[r.statut] || RECO_ST.demandee; return `<div class="reco-item"><span style="min-width:0"><span class="ag-t">${esc(r.nom)}</span><span class="ag-s">${esc(r.role || "")}</span></span>
        <button type="button" class="reco-st ${cls}" data-reco="${i}" title="Changer le statut" ${S.writable ? "" : "disabled"}>${lab}</button></div>`; }).join("") : `<p class="muted">Aucune pour l'instant.</p>`}
      <form class="add" id="f-reco"><input id="reco-nom" placeholder="Nom et rôle (ex. Nicolas Bouchet, Dior)" autocomplete="off" aria-label="Personne à ajouter"><button class="btn small" type="submit" ${S.writable ? "" : "disabled"}>Ajouter</button></form>
      <p class="muted" style="font-size:.78rem">Touche le statut pour passer de « Demandée » à « Accord donné » puis « Reçue ».</p></section>`;
  }

  function blocChiffres(cands) {
    const s = o => S.suivi.get(o.id) || {};
    const envoyees = cands.filter(o => APRES_ENVOI.has(s(o).etape) || s(o).envoye_le);
    const reponses = cands.filter(o => ["entretien", "offre", "refus"].includes(s(o).etape));
    const pct = (a, b) => b ? Math.round(100 * a / b) + " %" : "—";
    const lundi = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
    const debut = lundi(new Date());
    const semaines = Array.from({ length: 8 }, (_, k) => { const d = new Date(debut); d.setDate(d.getDate() - 7 * (7 - k)); return d; });
    const parSem = semaines.map(d => { const f = d.getTime() + 7 * 86400000; return envoyees.filter(o => { const e = s(o).envoye_le; if (!e || String(e).length < 10) return false; const t = new Date(e).getTime(); return t >= d.getTime() && t < f; }).length; });
    const max = Math.max(2, ...parSem), W = 560, H = 150, pad = 26, bw = (W - pad * 2) / 8;
    const y = v => H - 22 - (H - 44) * v / max;
    const grille = [0, Math.ceil(max / 2), max].map(v => `<line x1="${pad}" x2="${W - pad}" y1="${y(v)}" y2="${y(v)}" class="g"/><text x="${pad - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${v}</text>`).join("");
    const barres = parSem.map((n, k) => { const x = pad + k * bw + bw * 0.2, h = H - 22 - y(n); return `${n ? `<rect x="${x}" y="${y(n)}" width="${bw * 0.6}" height="${Math.max(h, 0)}" rx="3" class="${k === 7 ? "b now" : "b"}"/><text x="${x + bw * 0.3}" y="${y(n) - 5}" text-anchor="middle" class="v">${n}</text>` : ""}<text x="${x + bw * 0.3}" y="${H - 6}" text-anchor="middle" class="ax">${semaines[k].getDate()} ${MOIS[semaines[k].getMonth()]}</text>`; }).join("");
    const canaux = {}; for (const o of cands) { const c = o.canal || "—"; canaux[c] = (canaux[c] || 0) + 1; }
    const maxC = Math.max(1, ...Object.values(canaux));
    return `<section class="sv-chiffres"><div class="section-head"><h2>Tes chiffres</h2><p>Toutes les candidatures suivies, Copilote et démarches ajoutées</p></div>
      <div class="kpis">
        <div class="kpi"><b>${envoyees.length}</b><span>candidatures envoyées</span></div>
        <div class="kpi"><b>${cands.filter(o => s(o).etape === "entretien").length}</b><span>en discussion</span></div>
        <div class="kpi"><b>${cands.filter(o => s(o).etape === "offre").length}</b><span>offres reçues</span></div>
        <div class="kpi"><b>${pct(reponses.length, envoyees.length)}</b><span>taux de réponse</span></div>
      </div>
      <div class="split">
        <div class="card"><h3>Envoyées par semaine <small>8 dernières semaines, date connue</small></h3>
          <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Candidatures envoyées par semaine">${grille}${barres}</svg></div>
        <div class="card"><h3>Par canal</h3><div class="bars">${Object.entries(canaux).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<div class="bar"><span>${esc(CANAUX[c] || (c === "—" ? "Non précisé" : c))}</span><div class="track"><div class="fill" style="width:${Math.round(100 * n / maxC)}%"></div></div><span class="n">${n}</span></div>`).join("")}</div></div>
      </div></section>`;
  }

  // Panneau « Ajouter une démarche »
  function drawerAjout() {
    const opt = (v, l, sel) => `<option value="${v}" ${sel ? "selected" : ""}>${l}</option>`;
    return `<div class="drawer-bg" data-close></div>
      <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="aj-t">
        <button class="btn ghost close" type="button" data-close>Fermer ✕</button>
        <div><div class="eyebrow">Suivi</div><h2 id="aj-t">Ajouter une démarche</h2>
          <p class="muted" style="margin:4px 0 0">Une candidature faite hors de Copilote : entretien en cours, offre interne, approche d'un recruteur…</p></div>
        <form id="f-ajout" class="form-grid">
          <label for="aj-ent">Entreprise *<input id="aj-ent" required autocomplete="off"></label>
          <label for="aj-poste">Poste *<input id="aj-poste" required autocomplete="off"></label>
          <label for="aj-lieu">Lieu<input id="aj-lieu" autocomplete="off"></label>
          <label for="aj-url">Lien de l'offre<input id="aj-url" type="url" placeholder="https://" autocomplete="off"></label>
          <label for="aj-canal">Canal<select id="aj-canal">${opt("", "Non précisé")}${Object.entries(CANAUX).map(([k, l]) => opt(k, l)).join("")}</select></label>
          <label for="aj-etape">Étape<select id="aj-etape">${["interessante", "postulee", "relance", "entretien", "offre", "refus", "sans_suite"].map(k => opt(k, ETAPE_LABEL[k], k === "postulee")).join("")}</select></label>
          <label for="aj-date">Date de candidature ou du dernier échange<input id="aj-date" type="date" value="${aujourdhui()}"></label>
          <label for="aj-contact">Contact<input id="aj-contact" placeholder="Nom, rôle" autocomplete="off"></label>
          <label for="aj-next">Prochaine étape<input id="aj-next" placeholder="Ex. relancer la RH" autocomplete="off"></label>
          <label for="aj-next-date">Pour le<input id="aj-next-date" type="date"></label>
          <label for="aj-note" class="wide">Notes<textarea id="aj-note" placeholder="Ce qu'il faut retenir"></textarea></label>
          <label class="check wide" for="aj-lvmh"><input id="aj-lvmh" type="checkbox"> Groupe LVMH : candidature interne, Copilote ne prépare rien</label>
          <div class="wide"><button class="btn primary" type="submit" ${S.writable ? "" : "disabled"}>Ajouter au suivi</button></div>
        </form>
      </aside>`;
  }

  async function ajouterDemarche(f) {
    if (!S.db) return;
    const v = id => ($("#" + id)?.value || "").trim();
    const ent = v("aj-ent"), poste = v("aj-poste");
    if (!ent || !poste) { toast("Indique au moins l'entreprise et le poste."); return; }
    const id = "m-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const etape = v("aj-etape") || "postulee", date = v("aj-date") || aujourdhui(), now = new Date().toISOString();
    const offre = { origine: "manuel", entreprise: ent, intitule: poste, lieu: v("aj-lieu"), url: safeUrl(v("aj-url")), canal: v("aj-canal"),
      date_collecte: aujourdhui(), statut: "suivi", groupe_lvmh: !!$("#aj-lvmh")?.checked };
    const suivi = { etape, maj: now, historique: [{ etape, date }], journal: [], contact: v("aj-contact"), prochaine_action: v("aj-next"), prochaine_date: v("aj-next-date"), note: v("aj-note") };
    if (APRES_ENVOI.has(etape)) suivi.envoye_le = date;
    try {

  function filtreHistorique() {
    const q = S.hist.q.trim().toLowerCase();

      if (S.hist.statut === "suivies" && etapeDe(o.id) === "nouvelle") return false;
      if (["propose", "a_surveiller", "exclu"].includes(S.hist.statut) && o.statut !== S.hist.statut) return false;

    const v = (location.hash || "").replace("#", "");
    S.view = v === "pipeline" ? "suivi" : ["aujourdhui", "suivi", "historique", "reglages"].includes(v) ? v : "aujourdhui";
    S.ecartEnCours = null;
    $("#main").innerHTML = ""; render(); window.scrollTo(0, 0);
  }

  // ---------- Événements ----------
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-open],[data-act],[data-close],[data-rm],[data-copy],[data-pdf],[data-phase],[data-filtre],[data-reco],#h-csv,#dr-save,#dr-j-add");
    if (!t) return;
    if (t.dataset.copy) { copier(t.dataset.copy); return; }
    if (t.dataset.pdf) { telechargerPdf(t.dataset.pdf, t.dataset.nom || "CV.pdf"); return; }
    if (t.dataset.open) { S.ajout = false; S.ouvert = t.dataset.open; drawer(true); return; }
    if (t.hasAttribute("data-close")) { S.ouvert = null; S.ajout = false; drawer(); return; }
    if (t.dataset.phase) { S.sv.filtre = S.sv.filtre === t.dataset.phase ? "actives" : t.dataset.phase; render(); return; }
    if (t.dataset.filtre) { S.sv.filtre = t.dataset.filtre; render(); return; }
    if (t.dataset.reco !== undefined) {
      const items = [...((S.recos && S.recos.items) || [])], i = Number(t.dataset.reco); if (!items[i]) return;
      items[i] = { ...items[i], statut: RECO_SUIVANT[items[i].statut] || "accord" }; ecrireRecos(items); return;
    }
    if (t.id === "dr-j-add") {
      const txt = ($("#dr-j-txt")?.value || "").trim(); if (!txt) { toast("Écris d'abord ce qui s'est passé."); return; }
      const s = S.suivi.get(S.ouvert) || {};
      const journal = [...(Array.isArray(s.journal) ? s.journal : []), { date: $("#dr-j-date")?.value || aujourdhui(), texte: txt }].slice(-60);
      ecrireSuivi(S.ouvert, { etape: etapeDe(S.ouvert), journal }, "Ajouté au journal"); setTimeout(() => drawer(), 0); return;
    }
    if (t.id === "h-csv") { exporterCSV(); return; }
    if (t.id === "dr-save") {
      const val = id => ($("#" + id)?.value || "").trim();
      ecrireSuivi(S.ouvert, { etape: etapeDe(S.ouvert), note: val("dr-note"), contact: val("dr-contact"), prochaine_action: val("dr-next"), prochaine_date: val("dr-next-date") }, "Enregistré");
      setTimeout(() => drawer(), 0); return;
    }
    if (t.dataset.rm !== undefined) {
      const g = reglages(); const c = [...(g.cibles || [])]; c.splice(Number(t.dataset.rm), 1);
      S.reglages = { ...g, cibles: c }; render(); ecrireReglages(S.reglages); return;
    }
    const act = t.dataset.act, h = t.dataset.h;
    if (act === "annuler-ecart") { S.ecartEnCours = null; render(); return; }
    if (act === "ajout-demarche") { S.ouvert = null; S.ajout = true; drawer(true); return; }
    if (act === "confirme") { ecrireSuivi(h, { etape: etapeDe(h), a_confirmer: "" }, "Marqué à jour"); setTimeout(() => drawer(), 0); return; }
    if (act === "ecarter") { S.ecartEnCours = h; render(); $("#motif-" + CSS.escape(h))?.focus(); return; }
    if (act === "rouvrir") { ecrireSuivi(h, { etape: "nouvelle", motif_ecart: "" }, "Offre rouverte"); return; }
    if (act === "relance") { ecrireSuivi(h, { etape: "relance" }, "Relance notée. La suivante sera proposée dans 7 jours."); setTimeout(() => drawer(), 0); return; }
    if (act === "postulee" && S.ouvert === h) { ecrireSuivi(h, { etape: "postulee" }, "Candidature notée comme envoyée. Relance dans 7 jours."); setTimeout(() => drawer(), 0); return; }
    if (act) {
      const cur = etapeDe(h);
      const next = cur === act ? "nouvelle" : act;
      const msg = { interessante: "Marquée intéressante", dossier_demande: "Dossier demandé : prêt vers 12 h 30 ou 18 h 45, sinon demain matin", postulee: "Candidature notée comme envoyée", nouvelle: "Étape retirée" }[next] || "Enregistré";
      ecrireSuivi(h, { etape: next }, msg);
    }
  });
  document.addEventListener("submit", e => {
    const f = e.target; e.preventDefault();
    if (f.dataset.ecart) {
      const h = f.dataset.ecart; const motif = (f.motif.value || "").trim();
      S.ecartEnCours = null; ecrireSuivi(h, { etape: "ecartee", motif_ecart: motif || "Sans motif" }, "Offre écartée");
    } else if (f.id === "f-ajout") { ajouterDemarche(f);
    } else if (f.id === "f-reco") {
      const v = ($("#reco-nom")?.value || "").trim(); if (!v) return;
      const [nom, ...role] = v.split(",");
      ecrireRecos([...((S.recos && S.recos.items) || []), { nom: nom.trim(), role: role.join(",").trim(), statut: "demandee" }]);
    } else if (f.id === "add-cible") {
      const v = $("#cible-in").value.trim(); if (!v) return;
      const g = reglages(); if ((g.cibles || []).some(c => c.toLowerCase() === v.toLowerCase())) { toast("Déjà dans la liste"); return; }
      S.reglages = { ...g, cibles: [...(g.cibles || []), v] }; render(); ecrireReglages(S.reglages); $("#cible-in")?.focus();
    } else if (f.id === "f-candidat") {
      const next = { ...(S.candidat || {}) };
      f.querySelectorAll("input[data-k]").forEach(i => { next[i.dataset.k] = i.value.trim(); });
      S.candidat = next;
      S.db && S.db.doc("reglages/candidat").set({ ...next, maj: new Date().toISOString() }).then(() => toast("Infos enregistrées"), () => toast("Enregistrement impossible pour l'instant."));
    } else if (f.id === "f-reglages") {
      const num = (id, d) => { const n = parseFloat($(id).value.replace(",", ".")); return Number.isFinite(n) ? n : d; };
      const g = reglages();
      S.reglages = { ...g, seuil: num("#r-seuil", g.seuil), passe_droit: num("#r-passe", g.passe_droit), plafond_jour: Math.round(num("#r-plafond", g.plafond_jour)) };
      ecrireReglages(S.reglages);
    }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.move) ecrireSuivi(t.dataset.move, { etape: t.value }, "Étape mise à jour : " + ETAPE_LABEL[t.value]);
    else if (t.id === "dr-etape") ecrireSuivi(S.ouvert, { etape: t.value }, "Étape mise à jour : " + ETAPE_LABEL[t.value]);
    else if (t.id === "pipe-axe") { S.pipeAxe = t.value; render(); }
    else if (t.id === "h-statut") { S.hist.statut = t.value; renderHistoriqueResultats(); }
    else if (t.id === "h-tri") { S.hist.tri = t.value; renderHistoriqueResultats(); }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "h-q") { S.hist.q = e.target.value; renderHistoriqueResultats(); }
    else if (e.target.id === "sv-q") { S.sv.q = e.target.value; renderSuiviListe(); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && (S.ouvert || S.ajout)) { S.ouvert = null; S.ajout = false; drawer(); } });
  window.addEventListener("hashchange", route);
  // Une erreur inattendue s'affiche au lieu de laisser une page figée
  window.addEventListener("error", e => {
    if (!e.message || /ResizeObserver|Script error/.test(e.message)) return;
    const m = $("#main"); if (!m || $("#err-banner")) return;
    m.insertAdjacentHTML("afterbegin", `<div class="banner-err" id="err-banner" role="alert">Un problème d'affichage est survenu (${esc(e.message)}). Recharge la page ; si ça continue, signale-le à Claude.</div>`);
  });

  // ---------- Connexion aux données ----------
  async function start() {
    route();
    const timer = setTimeout(() => { S.stale = true; render(); }, 10000);
    let db = null;
    try { db = await claude.use("db"); } catch { db = null; }
    if (!db) {
      clearTimeout(timer); S.loaded.offres = true;
      $("#main").innerHTML = `<div class="empty">Les données ne sont pas disponibles dans cette vue. Ouvre la page depuis claude.ai en étant connecté.</div>`;
      $("#status").textContent = ""; return;
    }
    S.db = db;
    try { S.dl = await claude.use("downloads"); } catch { S.dl = null; }
    const onErr = () => { S.loaded.offres = true; clearTimeout(timer); render(); };
    const done = (k, snap) => { if (!snap.metadata.fromCache) { S.loaded[k] = true; S.syncAt = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); if (k === "offres") { clearTimeout(timer); S.stale = false; } } };
    db.collection("offres").onSnapshot(snap => {
      S.offres = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }])); done("offres", snap); render(); refreshDrawer();
    }, onErr);
    db.collection("suivi").onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return; // nos propres écritures sont déjà appliquées localement
      S.suivi = new Map(snap.docs.map(d => [d.id, d.data()])); done("suivi", snap); render();
    }, () => {});
    db.collection("dossiers").onSnapshot(snap => { S.dossiers = new Map(snap.docs.map(d => [d.id, d.data()])); render(); refreshDrawer(); }, () => {});
    db.collection("rapports").onSnapshot(snap => {
      S.rapports = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.date || b.id).localeCompare(String(a.date || a.id))); done("rapports", snap); render();
    }, () => {});
    db.doc("reglages/candidat").onSnapshot(snap => { S.candidat = snap.exists ? snap.data() : null; if (S.view === "reglages" && !document.activeElement?.closest("form")) render(); refreshDrawer(); }, () => {});
    db.doc("reglages/recommandations").onSnapshot(snap => { S.recos = snap.exists ? snap.data() : null; if (S.view === "suivi" && !document.activeElement?.closest("form")) render(); }, () => {});
    db.doc("reglages/general").onSnapshot(snap => { S.reglages = snap.exists ? snap.data() : null; if (S.view === "reglages" && !document.activeElement?.closest("form")) render(); }, () => {});
  }
  start();
})();
</script>
