# Périmètre de recherche — Copilote Candidatures
# Valeurs par défaut versionnées. Le dashboard (écran Réglages) peut les surcharger
# via la table `settings` de Supabase : la valeur en base gagne sur ce fichier.
# Décisions de David du 13/11/2026 intégrées.

version: 2026-11-13

# ---------------------------------------------------------------------------
# File de validation
# ---------------------------------------------------------------------------
scoring:
  seuil: 6                # note /10 minimale pour proposer une offre (en dessous : archivée, consultable)
  passe_droit: 8          # >= 8/10 : toujours proposée, même au-delà du plafond quotidien
  plafond_dossiers_jour: 5   # nombre moyen de dossiers proposés par jour (hors passe-droit)
  bonus:                  # points ajoutés au score brut, plafonné à 10
    entreprise_cible: 1.0
    groupe_lvmh: 1.0
    banque: 0.5
    ia: 0.5
  priorite_axes:          # ordre de priorité n°1 → départage à score égal
    - data_bi
    - finance
    - supply_chain
    - startup

# ---------------------------------------------------------------------------
# Axes métier
# ---------------------------------------------------------------------------
axes:
  data_bi:
    libelle: Data / BI
    intitules:
      - Data Analyst
      - BI Analyst
      - Business Intelligence Analyst
      - Analytics Engineer junior
      - Analyste décisionnel
      - Business Data Analyst
  finance:
    libelle: Finance
    intitules:
      - FP&A Analyst
      - Financial Analyst
      - Contrôleur de gestion junior
      - Business Analyst finance
      - Analyste financier
  supply_chain:
    libelle: Supply Chain
    intitules:
      - Demand Planner
      - Supply Planner
      - Analyste supply chain
      - Supply Chain Analyst
      - S&OP Analyst
  startup:
    libelle: Startup / Entrepreneuriat
    intitules:
      - Chief of Staff
      - Business Operations
      - Bizops Analyst
      - Strategy & Operations Analyst

# ---------------------------------------------------------------------------
# Zones (ordre = priorité)
# ---------------------------------------------------------------------------
zones:
  cdi:
    - id: suisse
      libelle: Suisse francophone ou anglophone
      priorite: 1
      inclure:
        - Genève
        - Lausanne
        - Neuchâtel
        - Fribourg
        - Sion
        - Montreux
        - Vevey
        - Nyon
      # Postes en Suisse alémanique acceptés seulement si l'offre est en anglais
      # et n'exige pas l'allemand.
      exclure_si_allemand_requis: true
    - id: paris
      libelle: Paris et Île-de-France
      priorite: 2
    - id: lyon
      libelle: Lyon
      priorite: 3
    - id: australie
      libelle: Australie (Sydney, Melbourne ou Brisbane)
      priorite: 4
      condition: seulement les très bonnes offres (score >= passe_droit) ; David est très intéressé (14/11)
      droit_travail: aucun pour l'instant ; visa post-études (485) probable, non confirmé (14/11)
  vie:
    libelle: VIE, tous pays
    priorite_pays_anglophones: true
    royaume_uni: autorise   # David n'a pas la nationalité britannique (13/11/2026)
    pays_exclus:
      - Chine
      - Japon
      - Corée du Sud

# ---------------------------------------------------------------------------
# Langue du dossier
# ---------------------------------------------------------------------------
langue_dossier:
  regle: langue_offre   # décision du 13/11 : toujours la langue de l'offre, quel que soit le pays
  langues_possibles: [fr, en]
  si_autre_langue: en   # offre ni en français ni en anglais (rare) : dossier en anglais

# ---------------------------------------------------------------------------
# Titre du CV : changé pour chaque offre (décision du 13/11)
# ---------------------------------------------------------------------------
titre_cv:
  format: "David Perkins – {intitule}"
  source: intitulé du poste visé, dans la langue de l'offre
  longueur_max: 50          # tient sur une ligne dans le gabarit Canva (police 25 pt)
  retirer:                  # marqueurs de séniorité incompatibles avec un premier emploi
    - Senior
    - Sr.
    - Lead
    - Head of
    - Principal
    - Confirmé
    - Expérimenté
  retirer_mentions: ["H/F", "F/H", "(m/f/d)", "CDI", "Stage"]

# ---------------------------------------------------------------------------
# Exclusions automatiques
# ---------------------------------------------------------------------------
exclusions:
  experience_max_annees: 4      # exclure si l'offre exige plus de 4 ans
  mots_cles_intitule:           # insensible à la casse
    - consultant
    - consulting
    - conseil
    - ingénieur d'affaires
    - ingénieur commercial
    - business developer
    - key account
  types_entreprise:
    - cabinet de conseil
    - ESN
    - SSII
  langues_requises_exclues:
    - allemand
    - german
    - deutsch
  sites_isoles: true            # site loin d'une ville : à juger au scoring
  deduplication: entreprise + intitulé

# ---------------------------------------------------------------------------
# Entreprises
# ---------------------------------------------------------------------------
entreprises:
  # Décision du 13/11 : les offres du groupe LVMH (toutes Maisons) sont cherchées,
  # analysées et envoyées à David dans une rubrique à part, mais l'outil ne postule
  # JAMAIS et ne prépare aucun envoi externe : David postule lui-même en interne.
  groupe_lvmh:
    rechercher: true
    analyser: true
    candidature: interne_par_david   # aucun envoi, aucun kit ATS, aucun message de l'outil
    compte_dans_plafond_jour: false  # rubrique séparée, hors des 5 dossiers du jour
  groupe_lvmh_mots_cles:        # détection du groupe (bonus de score + règle interne)
    - LVMH
    - Dior
    - Louis Vuitton
    - Moët Hennessy
    - Sephora
    - Bulgari
    - Tiffany
    - TAG Heuer
    - Hublot
    - Zenith
    - Fendi
    - Celine
    - Loewe
    - Givenchy
    - Guerlain
    - Chandon
    - Dom Pérignon
    - Hennessy
    - Le Bon Marché
    - DFS
  # Liste courte de départ proposée par Claude (13/11), à élaguer et compléter
  # depuis l'écran Réglages. Les Maisons LVMH sont déjà couvertes par le bonus
  # groupe_lvmh ci-dessus ; les banques et l'IA ont aussi leur bonus.
  cibles:
    # Suisse
    - Richemont
    - Rolex
    - Pictet
    - Lombard Odier
    - UBS
    - dsm-firmenich
    - Nestlé
    - Philip Morris International
    - Logitech
    - SIG   # Services Industriels de Genève : CDD « Premier Emploi » pour jeunes diplômés (demande de David, 14/11)
    # Banque France
    - BNP Paribas
    - Société Générale
    - Crédit Agricole CIB
    - Bpifrance
    # IA, fintech, startups
    - Finary
    - Mistral AI
    - Qonto
    - Pennylane
    # Organisations internationales
    - CERN   # Genève ; graduate programme et postes juniors, délais courts (ajouté le 13/11)

# ---------------------------------------------------------------------------
# Envoi et suivi
# ---------------------------------------------------------------------------
envoi:
  plafond_envois_auto_jour: 10
  alerte_meme_entreprise_jours: 30
  relances_jours: [7, 14]
  signature: Respectueusement
  plateformes_sans_bot:         # « préparé par l'outil, cliqué par David »
    - linkedin
    - indeed

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
sources:
  france_travail_api: true
  alertes_email:
    libelle_gmail: Jobs         # libellé à créer (en attendant : « Carrière & Candidatures »)
    expediteurs:
      - jobalerts-noreply@linkedin.com
      - jobs-noreply@linkedin.com
      - apec.fr
      - welcometothejungle.com
      - jobteaser.com
      - jobs.ch
      - jobup.ch
      - businessfrance.fr
  pages_carrieres: true
  import_manuel: true

# ---------------------------------------------------------------------------
# Canva (références)
# ---------------------------------------------------------------------------
canva:
  cv_reference_fr: DAHYYApcz6Y   # FR-David-Perkins-CV-Consultant-Data-BI
  portfolio: DAHKpyISgqQ         # David_Perkins_Portfolio_all_4.pptx (21 pages)
  portfolio_url: https://www.canva.com/design/DAHKpyISgqQ/edit
  # PDF du portfolio dans le tableau de bord (/_blob/<id>) : vide tant qu'il n'a pas été exporté.
  # Le premier passage où Canva répond l'exporte une fois, l'envoie dans le tableau de bord et note
  # son URL ici ; tous les dossiers réutilisent ensuite ce même fichier.
  portfolio_pdf_url: /_blob/3415fcbcd648789b5175d3165f976e19   # exporté le 14/11/2026
